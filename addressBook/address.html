<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book System</title>
    <link rel="stylesheet" type="text/css" href="./address.css">
</head>
<body>
   <div class="container">
        <h1>Address Book System</h1>

        <form id="addressForm">
            <input type="text" id="fname" placeholder="Full Name" required />
            <input type="text" id="phone" placeholder="Phone Number" required />
            <input type="email" id="email" placeholder="Email" required />
            <input type="text" id="city" placeholder="City" required />
            <button type="submit" class="add-btn">Add Contact</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>City</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="contactList">

            </tbody>
        </table>
    </div>
    <script src="./address.js"></script>
</body>
</html>
